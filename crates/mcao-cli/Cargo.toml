[package]
name = "mcao-cli"
description = "PROPOSED (DPES-752 unconfirmed): mcao command-line skeleton; no subcommands in this slice."
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "mcao"
path = "src/main.rs"

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
mcao-core = { path = "../mcao-core" }
toml = "0.8.23"

[target.'cfg(unix)'.dependencies]
# openpty, fork, and the signal calls of `mcao herdr lab-viewer`. The version matches mcao-core's.
libc = "0.2.191"
# Read-only no-mistakes state database for the unix shell readers. Windows builds do not compile the bundled SQLite C code.
rusqlite.workspace = true
