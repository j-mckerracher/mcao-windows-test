[workspace]
resolver = "3"
members = [
    "crates/mcao-core",
    "crates/mcao-backend-unix",
    "crates/mcao-backend-windows",
    "crates/mcao-cli",
    "crates/mcao-probe",
]

[workspace.package]
version = "0.0.0"
edition = "2024"

[workspace.dependencies]
clap = { version = "4.6.7", features = ["derive"] }
# Bundled SQLite: the no-mistakes database readers run on the SQLite version this build compiles.
# Default features are off: they add the wasm-only sqlite-wasm-rs and the statement cache, which the readers do not use.
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Exact pin: the audit hash chain hashes with this SHA-256 (DPES-884 section 9).
sha2 = "=0.10.9"
# linux-tmpfs lists tmpfs mounts such as /dev/shm. linux-netdevs stays off: sysinfo documents
# that it can hang on a hard-mounted network share whose server is down.
sysinfo = { version = "=0.39.6", default-features = false, features = ["disk", "linux-tmpfs", "system"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_SystemServices", "Win32_System_Threading"] }
