# When Dependabot opens a dependency-update PR, ask GitHub Copilot to assess how the update
# may affect this application and what changes it may need. If a maintainer later comments
# `/apply-fixes`, create those application changes in a separate companion pull request.
# The assessment is one sticky comment updated in place on each re-run.
#
# Assessment does not merge, approve, or modify the Dependabot PR. Remediation is separately
# human-gated: it writes application changes to a companion branch and opens a companion PR,
# but never merges, approves, reviews, or alters the Dependabot PR's own commits.
#
# No secret is normally needed. The Copilot CLI authenticates with the built-in
# GITHUB_TOKEN through `copilot-requests: write`, and usage bills to the organization.
# This requires the org policy "Allow use of Copilot CLI billed to the organization".
# An optional personal-account fine-grained PAT fallback is shown below.
#
# The reusable workflow deliberately does not guess how to build the application. A build
# job must use this repository's real toolchain and commands, then pass its log and JUnit
# reports to the assessment as inert evidence. Run `/dependabot-app-context` after the
# application has been created; it infers that job instead of assuming a language here.
#
# ─── NEW REPO FROM THE TEMPLATE? ──────────────────────────────────────────
#   1. Run `/dependabot-app-context` after the app's manifests and CI exist. It writes
#      .github/ai-app-context.md and configures build/test evidence plus remediation guards.
#   2. Enable Actions to create pull requests and ensure companion-PR CI can target a
#      dependabot/** base branch. See the remediation reference linked below.
# ───────────────────────────────────────────────────────────────────────────────────
#
# Reusable workflow: mc-innersource/mc-ci-reusable-workflows# Full reference:
#   https://github.com/mc-innersource/mc-ci-reusable-workflows/blob/main/docs/dependabot-ai-impact-assessment.md
#   https://github.com/mc-innersource/mc-ci-reusable-workflows/blob/main/docs/dependabot-ai-remediation.md

name: Dependabot AI

on:
  # `pull_request_target`, NOT `pull_request`. Dependabot-triggered `pull_request` runs get
  # a fork-like read-only token that cannot comment or label.
  #
  # The privileged assessment job never EXECUTES anything from the PR branch -- it only
  # reads text. If the setup skill adds a build job, that job executes PR-head content but
  # has `contents: read`, no secrets, and no ability to comment, label, or push.
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

  # Human gate for the write path. Most bumps need no code changes, coding-agent runs cost
  # more than assessments, and automatic remediation on `synchronize` would create a loop.
  # `issue_comment` always uses this workflow from the default branch; the command will not
  # work until the template setup is merged there.
  issue_comment:
    types: [created]

# Declare permissions per job. This is important once a separate, unprivileged build job
# is added: repository write access must stay confined to the assessment job.
permissions: {}

jobs:
  # BUILD AND TEST EVIDENCE -- OPTIONAL, BUT STRONGLY RECOMMENDED
