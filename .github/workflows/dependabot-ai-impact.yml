  # Advisory only. Never merges, approves, or modifies the PR.
  assess:
    name: Assess
    # When the build job is enabled, add `needs: build` and replace this one-line guard
    # with the `always()` guard below. A red build is the most useful evidence and must not
    # silently skip assessment.
    # needs: build
    # if: >-
    #   always() &&
    #   github.event_name == 'pull_request_target' &&
    #   github.event.pull_request.user.login == 'dependabot[bot]'
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: read # read the manifest diff and application-context file
      pull-requests: write # post the assessment comment and apply the risk label
      issues: write # create the ai-risk:* label the first time it is used
      copilot-requests: write # authorize Copilot inference on the built-in GITHUB_TOKEN
    concurrency:
      group: dependabot-ai-assess-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    # Pinned to a RELEASE commit SHA with its version comment. This gives an immutable ref plus
    # Dependabot PRs when a new release ships. Never use
    # `@main`; `@v1` accepts minor/prompt changes without review, which is especially risky
    # if `fail-on-risk` becomes a required check. Resolve a release SHA as documented in:
    # https://github.com/mc-innersource/mc-ci-reusable-workflows/blob/main/docs/versioning.md
    uses: mc-innersource/mc-ci-reusable-workflows/.github/workflows/dependabot-ai-impact-assessment.yml@ed449b8ad620073467df187ec5b1b8d955888b20 # v2.0.1
    with:
      # Shared, versioned facts about the application. The setup skill replaces the
      # placeholder in this file after inspecting the repository.
      app-context-file: .github/ai-app-context.md

      # `/dependabot-app-context` may add repository-specific `extra-instructions`,
      # `usage-scan-paths`, and the build-* inputs here. Those values must be inferred
      # from this app; fixed language or directory assumptions do not belong in a template.

      # BUILD AND TEST EVIDENCE -- uncomment only together with the configured build job,
      # its `needs: build`, and the `always()` assessment guard above.
      # build-artifact: build-evidence-${{ github.event.pull_request.number }}
      # build-status: ${{ needs.build.outputs.build-status }}
      # build-command: ${{ needs.build.outputs.build-command }}
      # baseline-status: ${{ needs.build.outputs.baseline-status }}
      # test-status: ${{ needs.build.outputs.test-status }}
      # fail-on-build-failure: false # optional compiler gate; independent of model risk

      # Advisory only -- never block a PR on the model's verdict. Change to `high` once you
      # trust the assessments and want it as a required check.
      fail-on-risk: never
      # Must match the comment prefix in the remediate job below. This makes the sticky
      # assessment comment advertise the human-gated fix command when changes are needed.
      remediation-command: /apply-fixes

      # Optional. Defaults shown; uncomment only what this repository needs.
      # model: auto
      # copilot-cli-version: latest
      # usage-scan-paths: '.'
      # usage-scan-context: 2
      # apply-risk-label: true
      # label-prefix: ai-risk
      # post-comment: true

    # Only needed if the organization has not enabled Copilot CLI billing through the
    # built-in token. The secret must be a fine-grained PAT owned by a personal account
    # with account-level Copilot Requests permission; classic PATs are rejected.
    # secrets:
    #   copilot-token: ${{ secrets.COPILOT_TOKEN }}

  # WRITE PATH -- creates or updates a companion branch and PR based on the Dependabot
  # branch. The reusable workflow splits model generation (no write token) from mechanical
  # patch verification/publication (write token, never executes the patch).
  remediate:
    name: Remediate
    # All four clauses matter. This prevents comments on ordinary issues, human-authored
    # PRs, unrelated comments, and the pull_request_target event from starting an agent.
    # The reusable workflow independently verifies the commenter has write permission;
    # keep that check enabled even though this caller guard also limits cost/blast radius.
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/apply-fixes') &&
      github.event.issue.user.login == 'dependabot[bot]'
    permissions:
      contents: write # push the companion branch
      pull-requests: write # open/update the companion PR and link it from Dependabot's PR
      issues: write # acknowledge the command and optionally manage a pending label
      copilot-requests: write # authorize Copilot inference on the built-in GITHUB_TOKEN
    # Never cancel publication halfway through: that can leave a pushed branch with no PR.
    concurrency:
      group: dependabot-ai-remediate-${{ github.event.issue.number }}
      cancel-in-progress: false
    # Keep remediation on the same immutable RELEASE SHA as assessment. Pinning is especially
    # important here because this workflow writes code and enforces patch guards.
    uses: mc-innersource/mc-ci-reusable-workflows/.github/workflows/dependabot-ai-remediation.yml@ed449b8ad620073467df187ec5b1b8d955888b20 # v2.0.1
    with:
      pr-number: ${{ github.event.issue.number }}
      app-context-file: .github/ai-app-context.md
      # `/dependabot-app-context` replaces this generic minimum-change rule with additional
      # repository-supported invariants when they can be inferred. Facts stay in the shared
      # context file; instructions here constrain what the coding agent may change.
      extra-instructions: |
        Make the minimum application change needed for this dependency update.
        Do not refactor unrelated code or change behavior that the update does not require.

      # Safe defaults are enforced by the reusable workflow: manifests are read-only;
      # lockfiles, CI workflows, Dependabot config, CODEOWNERS, and git metadata are denied.
      # Add repository-specific protected paths only when evidence supports them.
      # deny-paths: 'path/pattern/* contract-file'
      allow-manifest-changes: false
      require-write-permission: true
      require-dependabot-actor: true
      comment-on-dependabot-pr: true
      # max-changed-files: 20
      # max-patch-lines: 1000
      # assessment-comment-marker: dependabot-ai-impact
      # branch-prefix: ai-remediation
      # pending-label: ''
      # model: auto
      # copilot-cli-version: latest
      # app-client-id: ${{ vars.AI_REMEDIATION_APP_CLIENT_ID }}

    # No secret is required. The built-in token opens companion-PR CI in an
    # approval-required state. Configure an App or PAT only if the user deliberately wants
    # CI to start without that maintainer approval click.
    # secrets:
    #   app-private-key: ${{ secrets.AI_REMEDIATION_APP_PRIVATE_KEY }}
    #   write-token: ${{ secrets.AI_REMEDIATION_TOKEN }}
    #   copilot-token: ${{ secrets.COPILOT_TOKEN }}

