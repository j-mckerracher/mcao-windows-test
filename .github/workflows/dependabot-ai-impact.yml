  # trustworthy build. The structure is generic; only the runner, toolchain setup, commands,
  # and report paths vary by repository. Keeping it commented lets this template remain a
  # valid static assessment before an application or even a language has been chosen.
  #
  # This job is the ONLY place PR-head content may execute. A dependency build can run
  # repository scripts, package lifecycle hooks, compiler plugins, and downloaded code.
  # Keep `contents: read`, pass no secrets, and do not use a persistent privileged runner.
  # The assessment receives only the resulting text/XML artifact as untrusted data.
