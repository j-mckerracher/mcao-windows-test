[project]
name = "mao-cloud"
version = "0.1.0"
description = "Versioned cloud execution protocol, controller, runner, and CLI for MCAO."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
controller = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "google-auth>=2.34,<3",
    "google-cloud-firestore==2.34.1",
    "google-cloud-storage>=2.18,<4",
    "requests>=2.34,<3",
]
runner = [
    "google-auth>=2.34,<3",
]

[project.scripts]
mao-cloud = "mao_cloud.cli:main"
mao-cloud-broker = "mao_cloud.serve:main"
mao-cloud-runner = "mao_cloud.runner:main"
mao-cloud-sweeper = "mao_cloud.sweeper:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.27,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "google-auth>=2.34,<3",
    "google-cloud-firestore==2.34.1",
    "google-cloud-storage>=2.18,<4",
    "requests>=2.34,<3",
    "cryptography>=43",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mao_cloud"]

[tool.uv]
# Supply-chain hold (DPES-809, inbox 011): the transitive gRPC packages resolve only to releases
# uploaded before 2026-10-16, the newest at least seven days old that google-cloud-firestore 2.34.1
# accepts. Scoped to these two packages; everything else keeps the default resolution.
exclude-newer-package = { grpcio = "2026-10-16T00:00:00Z", grpcio-status = "2026-10-16T00:00:00Z" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
